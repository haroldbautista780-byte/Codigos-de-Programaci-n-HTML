<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alcancía Fintech - Búho</title>
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<div class="todo">

  <!-- Menu -->
  <div class="menu">
    <a href="#">Inicio</a>
    <a href="#">Ahorros</a>
    <a href="#">Ayuda</a>
  </div>

  <!-- Logo y titulo -->
  <div class="cabeza">
    <img class="logo" src="https://images.pexels.com/photos/40091610/pexels-photo-40091610.jpeg?auto=compress&cs=tinysrgb&w=300&h=300&fit=crop" alt="Logo búho">
    <h1>Alcancía <b>Fintech</b></h1>
  </div>

  <!-- Contenido -->
  <div class="fila">

    <!-- Izquierda -->
    <div class="izq">
      <a href="#">Mi Alcancía</a>
      <a href="#">Depositar</a>
      <a href="#">Mis Metas</a>
    </div>

    <!-- Centro -->
    <div class="cen">
      <h2>Datos del Cliente</h2>
      <p class="saldo">Saldo: <i>$ 250.000</i> &nbsp; Meta: $ 1.000.000</p>

      <form action="#" method="post">
        <label>Nombre:</label>
        <input type="text" placeholder="Escribe tu nombre" required>

        <label>Email:</label>
        <input type="email" placeholder="ejemplo@correo.com" required>

        <label>Celular:</label>
        <input type="tel" placeholder="300 123 4567" required>

        <label>Monto a ahorrar:</label>
        <input type="number" placeholder="$ 10.000" min="1000">

        <br>
        <button class="btn" type="submit">Enviar</button>
      </form>
    </div>

    <!-- Derecha -->
    <div class="der">
      <div class="top"></div>
      <a href="#"><b>Alcancía Pro</b> &nbsp; Producto1</a>
      <a href="#"><b>Bono Ahorro</b> &nbsp; Promoción2</a>
      <a href="#"><b>Sin Comisión</b> &nbsp; Descuento3</a>
    </div>

  </div>

  <!-- Pie -->
  <div class="pie">Harold Stiven Bautista &nbsp; • &nbsp; Búho Alcancía Fintech © 2026</div>
  <div class="barra"></div>

</div>

</body>
</html>
